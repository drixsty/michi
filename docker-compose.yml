version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: michi-postgres
    environment:
      POSTGRES_USER: michi
      POSTGRES_PASSWORD: michi123
      POSTGRES_DB: michi_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U michi"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis (optionnel pour caching)
  redis:
    image: redis:7-alpine
    container_name: michi-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Mailpit (SMTP Mock & Web Mailbox)
  mailpit:
    image: axllent/mailpit:v1.15
    container_name: michi-mailpit
    ports:
      - "1025:1025" # SMTP Port
      - "8025:8025" # Web UI Port
    environment:
      - MP_MAX_MESSAGES=500
      - MP_DATA_FILE=/data/mailpit.db
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
  mailpit_data:
