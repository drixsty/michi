type Mutation {
  login(input: LoginInput!): AuthPayload!
  register(input: RegisterInput!): AuthPayload!
  googleLogin(input: GoogleLoginInput!): AuthPayload!
  verifyEmail(token: String!): Boolean!
  resendVerificationEmail(email: String!): Boolean!
  changePassword(input: ChangePasswordInput!): Boolean!
  updateProfile(input: UpdateProfileInput!): UserType!
  toggleUserStatus(userId: ID!, active: Boolean!): Boolean!
  forgotPassword(input: RequestPasswordResetInput!): Boolean!
  resetPassword(input: ResetPasswordInput!): Boolean!
  setup2fa: TwoFactorSetupType!
  confirm2fa(secret: String!, code: String!): TwoFactorConfirmResult!
  disable2fa: Boolean!
  verify2fa(mfaToken: String!, code: String!): AuthPayload!
  exportUserData: UserDataExportType!
  deleteAccount: Boolean!
  createOrganization(name: String!, plan: String! = "BASIC"): AuthPayload!
  switchOrganization(organizationId: ID!): AuthPayload!
  updateOrganization(input: UpdateOrganizationInput!): OrganizationType
  removeMember(userId: ID!): Boolean!
  updateMemberRole(userId: ID!, role: String!): Boolean!
  updateMemberPermissions(userId: ID!, permissions: String!): OrganizationMemberType
  inviteMember(email: String!, role: String!): InvitationType!
  acceptInvitation(code: String!): Boolean!
  deleteInvitation(invitationId: ID!): Boolean!
  markAlertAsRead(alertId: ID!): Boolean!
  updateProductSettings(id: ID!, leadTime: Int = null, moq: Int = null, boostFactor: Float = null, stockWeight: Float = null, costPrice: Float = null, salePrice: Float = null): ProductType!
  deleteAlert(alertId: ID!): Boolean!
  toggleSource(platform: String!, connected: Boolean!, storeId: ID = null): StoreType!
  ingestCsvData(storeId: ID!, csvContent: String!, skuCol: String! = "sku", dateCol: String! = "date", salesCol: String! = "sales", stockCol: String! = "stock", titleCol: String! = "title"): IngestionResult!
  analyzeCsv(csvContent: String!): CsvAnalysisType!
  updateStoreCredentials(input: UpdateCredentialInput!): CredentialType!
  testStoreConnection(storeId: ID!): TestConnectionResult!
  smartImport(infoInput: SmartImportInput!): IngestionResult!
  createPurchaseOrder(productId: ID!, supplierId: ID!, quantity: Int!): PurchaseOrderType!
  runCleaningPipeline(storeId: ID!): PipelineResultType!
  runPredictionPipeline(storeId: ID!): PredictionRunResultType!
  updateStrategicSettings(currency: String = null, isMutualized: Boolean = null): Boolean!
  triggerMockDataSync(storeId: ID = null, platform: String! = "shopify"): IngestionResult!
  triggerOmnichannelSync(storeId: ID = null): IngestionResult!
  createCheckoutSession(plan: String!, successUrl: String!, cancelUrl: String!): String!
  createBillingPortalSession(returnUrl: String!): String!
}

