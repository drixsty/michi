[pytest]
minversion = 7.0
# pythonpath garantit que apps/api/ est l'unique racine d'import (évite double-registration SQLAlchemy)
pythonpath = .
testpaths = tests src
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -ra
    --strict-markers
    --strict-config
    --showlocals
    --tb=short

markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    e2e: marks tests as end-to-end tests

asyncio_mode = auto
