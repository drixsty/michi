[tool.pyright]
include = ["src"]
exclude = ["**/node_modules", "**/__pycache__"]
executionEnvironments = [
  { root = "src" }
]
typeCheckingMode = "basic"
pythonVersion = "3.12"
reportMissingImports = true
reportMissingModuleSource = false

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
disallow_any_generics = false

[[tool.mypy.overrides]]
module = "modules.*.tests.*"
disallow_untyped_defs = false
check_untyped_defs = false

[[tool.mypy.overrides]]
module = "modules.*.models"
ignore_errors = true

[[tool.mypy.overrides]]
module = "core.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "modules.auth.infrastructure.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "modules.auth.application.*"
ignore_errors = true

[[tool.mypy.overrides]]
module = "modules.auth.service"
ignore_errors = true

[[tool.mypy.overrides]]
module = "modules.auth.invitation_service"
ignore_errors = true

[[tool.mypy.overrides]]
module = "modules.auth.decorators"
ignore_errors = true
