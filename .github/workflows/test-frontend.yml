name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/types/**'
      - '.github/workflows/test-frontend.yml'
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/**'
      - 'packages/ui/**'
      - 'packages/types/**'
      - '.github/workflows/test-frontend.yml'

jobs:
  type-check:
    name: TypeScript strict check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type-check apps/web
        working-directory: apps/web
        run: npx tsc --noEmit

      - name: Type-check packages/ui
        working-directory: packages/ui
        run: npx tsc --noEmit

  test-web:
    name: Vitest — apps/web
    runs-on: ubuntu-latest
    needs: type-check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run web tests
        working-directory: apps/web
        run: npm run test -- --run

  test-ui:
    name: Vitest — packages/ui
    runs-on: ubuntu-latest
    needs: type-check

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run UI tests
        working-directory: packages/ui
        run: npm run test
