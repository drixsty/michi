name: Michi Omnichannel CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  build-and-test:
    name: Build & Test (Turbo)
    runs-on: ubuntu-latest
    
    env:
      # Backend Environment Variables for Tests
      DATABASE_URL: sqlite+aiosqlite:///:memory:
      SECRET_KEY: ci-test-key
      ENVIRONMENT: test
      SMTP_HOST: localhost
      SMTP_PORT: 1025
      SMTP_USER: test
      SMTP_PASSWORD: test
      EMAIL_FROM: test@michi.com
      SHOPIFY_API_KEY: mock
      SHOPIFY_API_SECRET: mock
      SHOPIFY_REDIRECT_URI: http://localhost:8000
      SHOPIFY_SCOPES: read_products
      STRIPE_API_KEY: mock
      STRIPE_WEBHOOK_SECRET: mock
      STRIPE_PRICE_BASIC: price_1
      STRIPE_PRICE_PRO: price_2
      STRIPE_PRICE_ENTERPRISE: price_3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Important for Turbo's git integration

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Monorepo Dependencies (NPM)
        run: npm install

      - name: Install Python Dependencies
        run: |
          pip install -r apps/api/requirements.txt
          pip install -r apps/assistant/requirements.txt

      - name: Turbo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Run Build, Lint & Test (Turbo)
        run: npx turbo run build lint test --cache-dir=".turbo"

      - name: Upload Build Artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: production-artifacts
          path: |
            apps/web/.next
            apps/landing/.next
            dist
